<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ page.tab_title | default: page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}"/>
{% if page.noindex %}<meta name="robots" content="noindex"/>{% endif %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<link rel="stylesheet" href="{{ '/assets/css/marketing.css' | relative_url }}"/>
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}
<script src="{{ '/assets/js/forms.js' | relative_url }}" defer></script>
</body>
</html>
