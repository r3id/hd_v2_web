<a href="{{ include.post.url | relative_url }}" class="post"><div class="ph"><div class="imgfill"></div></div><span class="cat">{{ include.post.category }}</span><h3>{{ include.post.title }}</h3><p>{{ include.post.description }}</p><div class="meta">{{ include.post.date | date: "%-d %B %Y" }} · {{ include.post.read_time }}</div></a>
