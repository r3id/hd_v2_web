<a href="{{ include.post.url | relative_url }}" class="post"><div class="ph">{% if include.post.image %}<img src="{{ include.post.image | relative_url }}" alt="{{ include.post.image_alt }}"/>{% else %}<div class="imgfill"></div>{% endif %}</div><span class="cat">{{ include.post.category }}</span><h3>{{ include.post.title }}</h3><p>{{ include.post.card_excerpt | default: include.post.description }}</p><div class="meta">{{ include.post.date | date: "%-d %B %Y" }} · {{ include.post.read_time }}</div></a>
