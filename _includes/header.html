<header class="hdr">
  <div class="wrap hdr-in">
    <a href="{{ '/' | relative_url }}" class="brand"><img class="brand-logo" src="{{ '/assets/hd_logo.svg' | relative_url }}" alt="Housing Direct"/></a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}"{% if page.nav_active == 'home' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/for-landlords/' | relative_url }}"{% if page.nav_active == 'landlords' %} class="active"{% endif %}>Landlords</a>
      <a href="{{ '/for-agents/' | relative_url }}"{% if page.nav_active == 'agents' %} class="active"{% endif %}>Agents</a>
      <a href="{{ '/for-local-authorities/' | relative_url }}"{% if page.nav_active == 'councils' %} class="active"{% endif %}>Local authorities</a>
    </nav>
    <div class="hdr-right">
      <a href="{{ '/book-a-demo/' | relative_url }}" class="btn btn-teal btn-sm">Book a demo</a>
      <button class="hdr-burger" aria-label="Menu" onclick="document.body.classList.toggle('menu-open')"><i class="fa-solid fa-bars"></i><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
<nav class="mobile-menu">
    <a href="{{ '/' | relative_url }}"{% if page.nav_active == 'home' %} class="active"{% endif %}>Home</a>
    <a href="{{ '/for-landlords/' | relative_url }}"{% if page.nav_active == 'landlords' %} class="active"{% endif %}>Landlords</a>
    <a href="{{ '/for-agents/' | relative_url }}"{% if page.nav_active == 'agents' %} class="active"{% endif %}>Agents</a>
    <a href="{{ '/for-local-authorities/' | relative_url }}"{% if page.nav_active == 'councils' %} class="active"{% endif %}>Local authorities</a>
    <div class="mm-foot">
      <a href="{{ '/book-a-demo/' | relative_url }}" class="btn btn-teal">Book a demo</a>
    </div>
  </nav>
</header>
